<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sellers vs. Ukkonen (Cutoff)</title>
</head>
<body>
<h1>Sellers vs. Ukkonen-Cutoff</h1>
<br>
<div class="controls">
    <label>P</label><input id="p" type="text" value="ACGT">
    <label>T</label><input id="t" type="text" value="AGTCACGTGC">
    <label>k</label><input id="k" type="text" value="1">
    <button class="primary" id="load">Berechnen</button>
    <span style="flex:1"></span>
    <button id="reset">Zurück</button>
    <button id="step">Schritt</button>
    <button id="play">▶ Abspielen</button>
    <span style="flex:1"></span>
    <br>
    <label>I</label><input id="i" type="text" value="0" disabled>
    <label>J</label><input id="j" type="text" value="0" disabled>
    <label>iⱼ*</label><input id="lei_j" type="text" value="0" disabled>
    <div id="status"></div>
    <div id="diff"></div>
    <div class="svgwrap">
        <div id="stage_sellers"></div>
        <div id="stage_ukkonen"></div>
        <div id="stage_code">

        </div>
    </div>

</body>

</html>

<script>
    function compute(){
        // Werte einlesen und uppercase usw.
        P=document.getElementById('p').value.toUpperCase();
        T=document.getElementById('t').value.toUpperCase();
        K=Math.max(0,Math.min(3,parseInt(document.getElementById('k').value)||1));
        // Werte ggf korrigiert anzeigen
        document.getElementById('p').value=P;
        document.getElementById('t').value=T;document.getElementById('k').value=K;
        // Variablen
        I=document.getElementById('i').value;
        J=document.getElementById('j').value;
        LEI_J=[]
        M=P.length;
        N=T.length;
        LEI_J[0] = Math.min(M, K)
        initialisierung_active = false;
        columns_active = true;
        column_1_active = false;
        column_2_active = true;
        render();
    }

    function render(){
        // status();
        window.codeSVG=createCode();
        document.getElementById('stage_code').innerHTML=window.codeSVG;
    }

    function createCode() {
        y = 0;
        x = 5; // 45
        line_height = 35;
        rect_y = y-line_height;
        rect_x = x-5;

        code_svg = `<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1100" viewBox="0 0 1500 1900">`

        line_counter = 0;

        // #############
        group_one = [
            ["comment", "Initialize the 0-th column of the alignment matrix", 0],
            ["code",
                `i₀* ← min{${iftspanelse(initialisierung_active, M, "m")}, ⌊${iftspanelse(initialisierung_active, K,
                    "k")}/1⌋}`,0],
            ["loop", `for i ← 0 to ${iftspanelse(initialisierung_active, LEI_J[0], "i₀*")}}`,0],
            ["code",
                `C₀(${iftspanelse(initialisierung_active, I, "i")}) ← ${iftspanelse(initialisierung_active, I, "i")} · 1 = ${iftspanelse(initialisierung_active, I, "i")}`, 30],
            ["end", "end for", 0]
        ]

        group_two = [
            ["comment", "Process the matrix column by column", 0],
            ["loop", "for j ← 1 to n", 0]
        ]

        group_three = [
            ["code", "Cⱼ(0) ← 0", 30],
            ["code", `iⱼ* ← 0`, 30],
            ["code", `i ← 1`, 30]
        ]

        group_four = []


        colums_group_length = group_two.length + group_three.length;

        // ######## Group One
        h = group_one.length*line_height+10;
        code_svg += `<g id="initialisierung">  ${createRect(rect_x, rect_y, h, initialisierung_active)} ${groupToText(group_one, line_counter)} </g>`;
        line_counter += group_one.length;
        rect_y += h;

        const big_rect = rect_y;

        // ######## Group Two
        h = group_two.length*line_height+10;
        columns_0 = `${groupToText(group_two, line_counter)}`;
        line_counter += group_two.length;
        rect_y += h;

        // ######## Group Three
        h = group_three.length*line_height+10;
        columns_1 =
            `<g id="columns_1">   ${createSecondRect(rect_x, rect_y, h, column_1_active)} ${groupToText(group_three,
                line_counter)} </g>`;
        line_counter += group_three.length;
        rect_y += h;

        // ######## Group Four
        h = group_four.length*line_height+10;
        columns_2 =
            `<g id="columns_2">   ${createSecondRect(rect_x, rect_y, h, column_2_active)} ${groupToText(group_four,
                line_counter)} </g>`;



        // ######## Alle Columns zusammen führen

        code_svg += `<g id="columns">
                ${createRect(rect_x, big_rect, colums_group_length * line_height + 10, columns_active)}
                ${columns_0}
                ${columns_1}${columns_2}
         </g>`;


        // ########

        code_svg += `
            <text x="75" y="528" class="loop"> while i ≤ iⱼ₋₁* => <tspan class="variable">${I}</tspan> ≤ iⱼ₋₁* </text>
            <text x="105" y="563" class="formula"> Cⱼ(<tspan class="variable">${I}</tspan>) ← min {Cⱼ₋₁(<tspan class="variable">${I - 1}</tspan>) + cost(x[<tspan class="variable">${I}</tspan>],y[j]),</text>
                <text x="165" y="598" class="formula">                    Cⱼ₋₁(<tspan class="variable">${I}</tspan>) + γ,</text>
                <text x="165" y="633" class="formula">                    Cⱼ(<tspan class="variable">${I - 1}</tspan>) + γ}</text>
            <text x="105" y="668" class="if"> if Cⱼ(<tspan class="variable">${I}</tspan>) ≤ k</text>
            <text x="135" y="703" class="code"> iⱼ* ← <tspan class="variable">${I}</tspan></text>
            <text x="105" y="738" class="end"> end if</text>
            <text x="105" y="773" class="code"> i ← i + 1</text>
            <text x="75" y="808" class="end"> end while</text>
            <text x="75" y="843" class="if"> if i ≤ m</text>
            <text x="105" y="878" class="formula"> Cⱼ(i) ← min {Cⱼ₋₁(i−1) + cost(x[i],y[j]),</text>
                <text x="165" y="913" class="formula">                    Cⱼ(i−1) + γ}</text>
            <text x="105" y="948" class="if"> if Cⱼ(i) ≤ k</text>
            <text x="135" y="983" class="code"> iⱼ* ← i</text>
            <text x="105" y="1018" class="end"> end if</text>
            <text x="105" y="1053" class="code"> i ← i + 1</text>
            <text x="105" y="1088" class="loop"> while i ≤ m and Cⱼ(i−1) + γ ≤ k</text>
            <text x="135" y="1123" class="code"> Cⱼ(i) ← Cⱼ(i−1) + γ</text>
            <text x="135" y="1158" class="if"> if Cⱼ(i) ≤ k</text>
            <text x="165" y="1193" class="code"> iⱼ* ← i</text>
            <text x="135" y="1228" class="end"> end if</text>
            <text x="135" y="1263" class="code"> i ← i + 1</text>
            <text x="105" y="1298" class="end"> end while</text>
            <text x="75" y="1333" class="end"> end if</text>
            <text x="75" y="1368" class="if"> if iⱼ* = m and Cⱼ(m) ≤ k</text>
            <text x="105" y="1403" class="comment"> report match ending at column j and its cost</text>
            <text x="105" y="1438" class="return"> return (j, Cⱼ(m))</text>
            <text x="75" y="1473" class="end"> end if</text>
            <text x="${x}" y="1508" class="end">end for</text>
        </svg>`

        return code_svg;
    }

    function iftspanelse(boolean, iff, elsee) {
        return boolean ? `<tspan class="variable">${iff}</tspan>` : elsee
    }

    function createRect(rect_x, rect_y, h, boolean){
        return `<rect x="${rect_x}" y="${rect_y}" height="${(h)}" width="500" class=${boolean ?
            `active-step` :
            `transparent`}> </rect>`
    }

    function createSecondRect(rect_x, rect_y, h, boolean){
        return `<rect x="${rect_x}" y="${rect_y-10}" height="${(h)}" width="500" class=${boolean ?
            `active-substep` :
            `transparent`}> </rect>`
    }

    function groupToText(group, line_counter){
        svg_one = ``
        group.forEach(item=>{
            svg_one += `<text x="${x+item[2]}" y="${y+line_counter*line_height}" class="${item[0]}"> ${item[1]} </text>`
            line_counter++;
        })
        return svg_one
    }

    compute();
</script>


<style>
    .title {
        font: 700 30px "DejaVu Sans", sans-serif;
        fill: #111;
    }

    .meta {
        font: 18px "DejaVu Sans", sans-serif;
        fill: #222;
    }

    .variable {
        fill: #950E4F;
        font-weight: bold;
    }

    .code, .loop, .if, .end, .return, .formula {
        font-size: 18px;
        font-family: monospace;
        fill: #111;
    }

    .comment {
        font: italic 17px "DejaVu Sans", sans-serif;
        fill: #555;
    }

    .active-step {
        fill: #00acc1;
        opacity: 50%;
    }

    .active-substep {
        fill: #4a148c;
        opacity: 50%;
    }

    .transparent {
        fill: none;
    }



    .loop, .if, .return {
        font-weight: 700;
    }
</style>
