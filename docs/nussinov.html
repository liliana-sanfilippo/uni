<h2 class="sr-only">Interaktive Nussinov-Visualisierung mit sich diagonal füllender DP-Matrix und
    Bogendiagramm der
    Basenpaare</h2>

<div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0.5rem 0 1rem;">
    <label for="seq">RNA-Sequenz:</label>
    <input id="seq" type="text" value="GGGAAAUCC" spellcheck="false"
           style="width:150px;text-transform:uppercase;letter-spacing:2px;">
    <label for="allowGU">G-U-Paarung erlaubt</label> <input id="allowGU" value="off" type="checkbox"/>

    <button id="load">Neu berechnen</button>
    <button id="reset"><i class="ti ti-refresh" aria-hidden="true"></i> Reset</button>
    <button id="step">Schritt</button>
    <button id="play"><i class="ti ti-player-play" aria-hidden="true"></i> Abspielen</button>
    <span style="flex:1"></span>
    <label for="downloadSVG">Download Bogendiagramm</label>
    <button id="downloadSVG" onclick="download('nussinov.svg', document.getElementById('arc').innerHTML)">
        Als SVG ⬇
    </button>
    <button onclick="downloadPng(
    'nussinov.png',
    document.querySelector('#arc svg').outerHTML
)">
        Als PNG ⬇
    </button>
</div>
<p id="allow_info">  </p>
<p> Beispiel-Sequenzen: UCAGCGUCGA ; UUUGGGUG</p>

<div id="arc" style="margin:0 0 0.75rem;border:0.5px solid #8A7B84;width:min-content;padding:12px"></div>

<div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;">
    <div id="matrix"></div>
    <div style="flex:1;min-width:210px;">
        <div style="font-size:13px;color:black;margin-bottom:6px;">Aktueller Fall für N(i,j)</div>
        <div id="cases" style="display:flex;flex-direction:column;gap:6px;"></div>
        <div id="score" style="margin-top:14px;font-size:14px;"></div>
    </div>
</div>

<style>
    :root {
        --kap: #950E4F;
        --kom: #14060D;
        --sec: #BF1266;
        --defi: #EF58A0;
        --bsp: #F49EC4;
        --kmt: #8A7B84;
        --link: #A22F69;
        --bd: #E3CBD6;
        --hl: #F8CFE1;
        --ring: #FCE1EE;
    }

    * {
        box-sizing: border-box;
    }

    #matrix table {
        font-size: 13px;
    }

    #matrix td {
        width: 26px;
        height: 26px;
        text-align: center;
        border: 0.5px solid #8A7B84;
        color: black;
        transition: background .15s;
    }

    #matrix td.cur {
        outline: 2px solid #950E4F;
        background: #F49EC4;
        outline-offset: -2px;
    }

    .casebox {
        border: 0.5px solid black;
        border-radius: 6px;
        padding: 7px 10px;
        font-size: 13px;
        color: black;
        max-width: 300px
    }

    .casebox.win {
        border-color: #BF1266;
        background: #F49EC4;
        color: black;
    }

    .casebox b {
        font-family: monospace;
    }

    body {
        margin: 0;
        background: #fff;
        color: var(--kom);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        padding: 20px;
    }

    h1 {
        color: var(--kap);
        font-size: 22px;
        font-weight: 600;
        margin: 0 0 4px;
    }

    label {
        font-size: 13px;
        color: var(--sec);
        font-weight: 500;
    }

    input[type=text] {
        width: 110px;
        padding: 6px 8px;
        border: 1px solid var(--bd);
        border-radius: 6px;
        font-family: monospace;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 14px;
    }

    button {
        padding: 6px 12px;
        border: 1px solid var(--kap);
        background: #fff;
        color: var(--kap);
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
    }

    button:hover {
        background: var(--ring);
    }

    button.panelhead h2, .panelhead h3 {
        margin: 0;
        color: var(--kap);
    }

    .panelhead h3 {
        font-size: 15px;
        font-weight: 600;
    }

    .panelhead h2 {
        font-size: 18px;
    }
</style>

<script>
    (function () {
        const MINLOOP = 1;
        let s, n, N, choice, order, ptr, timer, allow_gu, pairs = null;
        function canPair(a, b) {
            return pairs[a + b] ? 1 : 0;
        }


        function compute() {
            n = s.length;
            N = Array.from({length: n}, () => Array(n));
            choice = Array.from({length: n}, () => Array(n));

            console.log(N)
            // nicht i = 2, sondern 1, weil Arrays bei 0 starten...
            // i <= n-1 und nicht i <= n analog
            for (let i = 1; i <= n-1; i++) {
                N[i][i-1] = 0;
                choice[i][i-1] = {t: "unpaired"}
            }

            // nicht i = 1, sondern i = 0, da arrays bei 0 starten
            // analog n-d-1 statt n-d
            for (let d = 0; d <= MINLOOP; d++){
                for (let i = 0; i <= n-d-1; i++) {
                    N[i][i+d] = 0;
                    choice[i][i+d] = {t: "unpaired"}
                }
            }

            // d bleibt so, weil es nur Bereiche beeinflusst
            // nicht i = 1, sondern i = 0, da arrays bei 0 starten
            // analog n-d-1 statt n-d
            for(let d  = MINLOOP+1; d <= n-1; d++) {
                for(let i = 0; i <= n-d-1; i++){
                    const j=i+d;
                    // Erstmal auf down setzen
                    // i ungepaart
                    let best = N[i + 1][j], c = {t: 'down'};

                    // webb aber links eine größere Zahl ist die nehmen
                    // j ungepaart
                    if (N[i][j - 1] > best) {
                        best = N[i][j - 1];
                        c = {t: 'left'};
                    }

                    // Score berechnen
                    const pv= canPair(s[i],s[j]);
                    // Wenn das mit dem score besser wäre, dann das nehmen
                    if (N[i + 1][j - 1] + pv > best) {
                        best = N[i + 1][j - 1] + 1;
                        c = {t: 'pair'};
                    }

                    // Wenn i+1<k<j gehen würde das durchgehen
                    for (let k = i + 1; k < j; k++) {
                        // Und daraus setzen, falls was Besseres dabei rauskommen würde
                        if (N[i][k] + N[k + 1][j] > best) {
                            console.log("i: " + i + " und k: " + k)
                            best = N[i][k] + N[k + 1][j];
                            c = {t: 'bif', k: k};
                        }
                    }

                    N[i][j]=best;
                    choice[i][j]=c;
                }
            }
            order = [];
            for (let l = 2; l <= n; l++) for (let i = 0; i + l - 1 < n; i++) order.push([i, i + l - 1]);
        }

        function traceback(i, j, out) {
            if (i >= j) return;
            const c = choice[i][j];
            if (!c) {
                return;
            }
            if (c.t === 'down') traceback(i + 1, j, out);
            else if (c.t === 'left') traceback(i, j - 1, out);
            else if (c.t === 'pair') {
                out.push([i, j]);
                traceback(i + 1, j - 1, out);
            } else {
                traceback(i, c.k, out);
                traceback(c.k + 1, j, out);
            }
        }

        function drawArc(revealed) {
            const W = Math.max(360, n * 40), pad = 26, gap = (W - 2 * pad) / (n - 1 || 1), H = 200, base = H - 26;
            let svg =
                `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">
       <title>RNA-Sequenz mit Basenpaar-Bögen</title>
       <desc>Bogendiagramm der gefundenen Basenpaare.</desc>`;
            let pr = [];
            if (revealed) traceback(0, n - 1, pr);
            for (const [a, b] of pr) {
                const x1 = pad + a * gap, x2 = pad + b * gap, r = (x2 - x1) / 2, cx = (x1 + x2) / 2;
                svg += `<path d="M ${x1} ${base} A ${r} ${r} 0 0 1 ${x2} ${base}" fill="none" stroke="#534AB7" stroke-width="1.6"/>`;
            }
            for (let i = 0; i < n; i++) {
                const x = pad + i * gap;
                svg += `<circle cx="${x}" cy="${base}" r="11" fill="#F594C3" stroke="#F594C3" stroke-width="0.5"/>`;
                svg += `<text x="${x}" y="${base + 4}" text-anchor="middle" font-family="monospace" font-size="13" fill="black">${s[i]}</text>`;
                svg += `<text x="${x}" y="${base + 24}" text-anchor="middle" font-size="11" fill="black">${i + 1}</text>`;
            }
            svg += `</svg>`;
            document.getElementById('arc').innerHTML = svg;
        }


        function drawMatrix() {
            let h = '<table><tr><th></th>';
            for (let j = 0; j < n; j++) h += `<th>${s[j]}</th>`;
            h += '</tr>';
            for (let i = 0; i < n; i++) {
                h += `<tr><th>${s[i]}</th>`;
                for (let j = 0; j < n; j++) {
                    if (j < i) h += '<td class="empty"></td>';
                    else if (j === i) h += '<td class="diag">0</td>';
                    else h += `<td class="empty" id="c${i}_${j}">·</td>`;
                }
                h += '</tr>';
            }
            document.getElementById('matrix').innerHTML = h + '</table>';
            for (let i = 0; i + 1 < n; i++) {
                const el = document.getElementById(`c${i}_${i + 1}`);
            }
        }

        function renderCases(i, j) {
            const c = choice[i][j], box = document.getElementById('cases');
            const pv = (j - i > MINLOOP ? canPair(s[i], s[j]) : 0);
            const items = [
                {t: 'down', txt: `<b>${s[i]}</b> ungepaart → N(i+1, j) = ${N[i + 1] ? N[i + 1][j] : 0}`},
                {t: 'left', txt: `<b>${s[j]}</b> ungepaart → N(i, j−1) = ${N[i][j - 1]}`},
                {
                    t: 'pair',
                    txt: `<b>${s[i]}·${s[j]}</b> paart ${pv ? '✓' : '✗'} → N(i+1, j−1)+${pv} = ${N[i + 1] && j - 1 >= 0 ? N[i + 1][j - 1] + pv : '–'}`
                },
                {t: 'bif', txt: `Aufspaltung bei k → maxₖ N(i,k)+N(k+1,j)`}
            ];
            box.innerHTML = items.map(o => `<div class="casebox${c && c.t === o.t ? ' win' : ''}">${o.txt}</div>`).join('');
            document.getElementById('score').innerHTML =
                `N(${i + 1}, ${j + 1}) = <b style="font-family:monospace">${N[i][j]}</b>`;
        }

        function reveal(idx) {
            const [i, j] = order[idx];
            const el = document.getElementById(`c${i}_${j}`);
            el.textContent = N[i][j];
            el.classList.remove('empty');
            el.style.background = N[i][j] > 0 ? '#15B097' : 'transparent';
            document.querySelectorAll('#matrix td.cur').forEach(e => e.classList.remove('cur'));
            el.classList.add('cur');
            renderCases(i, j);
        }

        function stepOnce() {
            if (ptr >= order.length) {
                stop();
                drawArc(true);
                document.getElementById('score').innerHTML += ' &nbsp;· fertig — optimale Faltung';
                return;
            }
            reveal(ptr++);
        }

        function stop() {
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
            document.getElementById('play').innerHTML = '<i class="ti ti-player-play"></i> Abspielen';
        }

        function play() {
            if (timer) {
                stop();
                return;
            }
            document.getElementById('play').innerHTML = '<i class="ti ti-player-pause"></i> Pause';
            timer = setInterval(() => {
                if (ptr >= order.length) {
                    stepOnce();
                    stop();
                } else stepOnce();
            }, 420);
        }

        function reset() {
           // allow_gu = document.getElementById('allowGU').checked;
            stop();
            ptr = 0;
            drawMatrix();
            drawArc(false);
            document.getElementById('cases').innerHTML =
                '<div class="casebox">Drücke <b>Schritt</b> oder <b>Abspielen</b>.</div>';
            document.getElementById('score').innerHTML = '';
        }

        function load() {
            document.getElementById('allowGU').checked = !allow_gu;
            document.getElementById('allowGU').value = !allow_gu ? "on" : "off";
            let v = document.getElementById('seq').value.toUpperCase().replace(/[^ACGU]/g, '');
            if (v.length < 2) v = 'GGGAAAUCC';
            if (v.length > 14) v = v.slice(0, 14);
            document.getElementById('seq').value = v;
            s = v;
            allow_gu = document.getElementById('allowGU').value === "on";
            pairs = {AU: 1, UA: 1, GC: 1, CG: 1, GU: (allow_gu? 1:0), UG: (allow_gu? 1:0)};
            document.getElementById("allow_info").innerText = allow_gu ?
                "Wichtig: Hier ist G-U Paarung erlaubt! Nicht davon verwirren lassen." : "";
            compute();
            reset();
        }

        function reloadGU (){
            reset();
            load();
        }

        document.getElementById('step').onclick = stepOnce;
        document.getElementById('play').onclick = play;
        document.getElementById('reset').onclick = reset;
        document.getElementById('load').onclick = load;
        document.getElementById('allowGU').onchange = reloadGU;
        load();
    })();

    function download(name, svg) {
        const blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + svg], {type: 'image/svg+xml;charset=utf-8'});
        const u = URL.createObjectURL(blob), a = document.createElement('a');
        a.href = u;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(u), 1500);
    }


    function downloadPng(filename, svgString, scale = 2) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(svgString, 'image/svg+xml');

        // Prüfen, ob der SVG-Parser einen Fehler gefunden hat
        const parserError = doc.querySelector('parsererror');

        if (parserError) {
            console.error('SVG ist ungültig:', parserError.textContent);
            return;
        }

        const svg = doc.documentElement;

        const viewBox = svg.getAttribute('viewBox');

        if (!viewBox) {
            console.error('SVG besitzt kein viewBox-Attribut.');
            return;
        }

        const values = viewBox.trim().split(/\s+/).map(Number);

        const width = values[2];
        const height = values[3];

        svg.setAttribute('width', width);
        svg.setAttribute('height', height);

        const serialized = new XMLSerializer()
            .serializeToString(svg);

        const blob = new Blob(
            [serialized],
            {type: 'image/svg+xml;charset=utf-8'}
        );

        const url = URL.createObjectURL(blob);
        const img = new Image();

        img.onload = function () {

            const canvas = document.createElement('canvas');

            canvas.width = width * scale;
            canvas.height = height * scale;

            const ctx = canvas.getContext('2d');

            ctx.scale(scale, scale);
            ctx.drawImage(img, 0, 0, width, height);

            URL.revokeObjectURL(url);

            canvas.toBlob(function (pngBlob) {

                if (!pngBlob) {
                    console.error('PNG konnte nicht erzeugt werden.');
                    return;
                }

                const pngUrl = URL.createObjectURL(pngBlob);

                const a = document.createElement('a');
                a.href = pngUrl;
                a.download = filename;

                document.body.appendChild(a);
                a.click();
                a.remove();

                setTimeout(() => {
                    URL.revokeObjectURL(pngUrl);
                }, 1000);

            }, 'image/png');
        };

        img.onerror = function (error) {
            console.error('SVG konnte nicht als Bild geladen werden.');
            console.log('SVG:', serialized);
            URL.revokeObjectURL(url);
        };

        img.src = url;
    }

    window.download = download;
</script>
