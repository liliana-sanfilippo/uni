<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Center-Star-Alignment</title>
    <style>
        :root {
            --kap: #950E4F;
            --kom: #14060D;
            --sec: #BF1266;
            --defi: #EF58A0;
            --bsp: #F49EC4;
            --kmt: #8A7B84;
            --bd: #E3CBD6;
            --hl: #F8CFE1;
            --ring: #FCE1EE;
            --grn: #1E9E6A;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fff;
            color: var(--kom);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            padding: 18px;
        }

        h1 {
            color: var(--kap);
            font-size: 21px;
            font-weight: 600;
            margin: 0 0 4px;
        }

        .sub {
            color: var(--kmt);
            font-size: 13px;
            margin: 0 0 14px;
            max-width: 820px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        textarea {
            width: 180px;
            height: 96px;
            padding: 6px 8px;
            border: 1px solid var(--bd);
            border-radius: 6px;
            font-family: monospace;
            text-transform: uppercase;
            font-size: 14px;
            resize: vertical;
        }

        button {
            padding: 6px 12px;
            border: 1px solid var(--kap);
            background: #fff;
            color: var(--kap);
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }

        button:hover {
            background: var(--ring);
        }

        button.primary {
            background: var(--kap);
            color: #fff;
        }

        .btns {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .row {
            display: flex;
            gap: 8px;
        }

        #status {
            font-size: 13px;
            color: var(--kom);
            margin: 4px 0 10px;
            min-height: 18px;
        }

        #status b {
            color: var(--kap);
        }

        .svgwrap {
            overflow-x: auto;
            padding: 8px;
        }
    </style>
</head>
<body>
<h1>Center-Star-Alignment</h1>
<br>
<div class="controls">
    <div>
        <div style="font-size:13px;color:var(--sec);font-weight:500;margin-bottom:3px;">Sequenzen (eine pro Zeile)</div>
        <textarea id="seqs">GCTAC
GCAC
GCTTAC
GTAC</textarea></div>
    <div class="btns">
        <button class="primary" id="load">Berechnen</button>
        <div class="row">
            <button id="prev">‹</button>
            <button id="next">›</button>
        </div>
        <button id="play">▶ Abspielen</button>
        <button id="dl">Als SVG ⬇</button>
    </div>
</div>

<div id="status"></div>
<div class="svgwrap">
    <div id="stage"></div>
</div>

<script>
    const COL = {
        kap: '#950E4F', kom: '#14060D', sec: '#BF1266', defi: '#EF58A0', bsp: '#F49EC4',
        kmt: '#8A7B84', bd: '#E3CBD6', hl: '#F8CFE1', ring: '#FCE1EE', grn: '#1E9E6A'
    };
    let S, K, DIST, ROWSUM, CEN, FRAMES, frame, timer = null;

    function nwAlign(a, b) {
        const m = a.length, n = b.length, D = [];
        // Ini für Erste Spalte
        for (let i = 0; i <= m; i++) {
            D[i] = [];
            D[i][0] = i;
        }
        // Ini für Erste Zeile
        for (let j = 0; j <= n; j++) {
            D[0][j] = j;
        }

        for (let i = 1; i <= m; i++) {
            for (let j = 1; j <= n; j++) {
                const c = a[i - 1] === b[j - 1] ? 0 : 1;
                D[i][j] = Math.min(D[i - 1][j - 1] + c, D[i - 1][j] + 1, D[i][j - 1] + 1);
            }
        }
        let i = m, j = n, aa = '', ab = '';
        while (i > 0 || j > 0) {
            if (i > 0 && j > 0 && D[i][j] === D[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)) {
                aa = a[i - 1] + aa;
                ab = b[j - 1] + ab;
                i--;
                j--;
            } else if (i > 0 && D[i][j] === D[i - 1][j] + 1) {
                aa = a[i - 1] + aa;
                ab = '-' + ab;
                i--;
            } else {
                aa = '-' + aa;
                ab = b[j - 1] + ab;
                j--;
            }
        }
        return {dist: D[m][n], aa, ab};
    }

    function mergeInto(msa, ac, ab) {
        const mc = msa[0], cols = mc.length, L = ac.length, R = msa.length;
        const out = msa.map(() => []), newRow = [], newGap = [];
        let i = 0, j = 0;

        function keep(col, sym) {
            for (let r = 0; r < R; r++) out[r].push(msa[r][col]);
            newRow.push(sym);
            newGap.push(false);
        }

        function insert(sym) {
            for (let r = 0; r < R; r++) out[r].push('-');
            newRow.push(sym);
            newGap.push(true);
        }

        while (i < cols || j < L) {
            const m1 = i < cols ? mc[i] : null, a1 = j < L ? ac[j] : null;
            if (m1 !== null && m1 !== '-' && a1 !== null && a1 !== '-') {
                keep(i, ab[j]);
                i++;
                j++;
            } else if (m1 === '-' && (a1 === null || a1 !== '-')) {
                keep(i, '-');
                i++;
            } else if (a1 === '-' && (m1 === null || m1 !== '-')) {
                insert(ab[j]);
                j++;
            } else if (m1 === '-' && a1 === '-') {
                keep(i, ab[j]);
                i++;
                j++;
            } else if (m1 === null) {
                insert(ab[j]);
                j++;
            } else {
                keep(i, '-');
                i++;
            }
        }
        out.push(newRow);
        return {rows: out, newGap};
    }

    function build() {
        const raw = document.getElementById('seqs').value.split(/\n+/).map(s => s.toUpperCase().replace(/[^ACGTU-]/g, '').replace(/-/g, '')).filter(s => s.length > 0);
        S = raw.slice(0, 5).map(s => s.slice(0, 20));
        if (S.length < 2) S = ['GCTAC', 'GCAC', 'GCTTAC', 'GTAC'];
        K = S.length;
        // Distanzmatrix
        DIST = [];
        for (let p = 0; p < K; p++) {
            DIST[p] = [];
            for (let q = 0; q < K; q++) {
                DIST[p][q] = p === q ? 0 : nwAlign(S[p], S[q]).dist;
            }
        }
        ROWSUM = DIST.map(r => r.reduce((a, b) => a + b, 0));
        CEN = 0;
        for (let p = 1; p < K; p++) if (ROWSUM[p] < ROWSUM[CEN]) CEN = p;
        // Merges
        FRAMES = [{type: 'dist'}];
        let MSA = [S[CEN].split('')];
        let labels = [CEN];
        const order = [];
        for (let p = 0; p < K; p++) if (p !== CEN) order.push(p);
        for (const p of order) {
            const {aa, ab} = nwAlign(S[CEN], S[p]);
            const {rows, newGap} = mergeInto(MSA, aa, ab);
            MSA = rows;
            labels = labels.concat([p]);
            FRAMES.push({
                type: 'merge',
                p,
                aa,
                ab,
                rows: MSA.map(r => r.slice()),
                newGap: newGap.slice(),
                labels: labels.slice()
            });
        }
        frame = 0;
    }

    /* ---------- SVG ---------- */
    function seqCells(ox, oy, str, opts) {
        opts = opts || {};
        const cw = opts.cw || 24;
        let s = '';
        for (let i = 0; i < str.length; i++) {
            const ch = str[i], x = ox + i * cw, gap = ch === '-';
            const hl = opts.hlCols && opts.hlCols[i];
            const fill = hl ? COL.hl : (opts.rowFill || '#fff');
            s += `<rect x="${x}" y="${oy}" width="${cw}" height="${cw}" fill="${fill}" stroke="${COL.bd}" stroke-width="0.7"/>`;
            s += `<text x="${x + cw / 2}" y="${oy + cw / 2 + 5}" text-anchor="middle" font-size="14" font-family="monospace" fill="${gap ? COL.defi : COL.kom}">${ch}</text>`;
        }
        return s;
    }

    function distSVG() {
        const cw = 30, rHW = 34, tH = 22, ox = 0, oy = tH + 22;
        let s = `<text x="0" y="16" font-size="15" font-weight="700" fill="${COL.kap}">Phase 1 – Zentrum bestimmen (Distanzmatrix + Zeilensummen)</text>`;
        // Spaltenkopf
        for (let q = 0; q < K; q++) s += `<text x="${ox + rHW + q * cw + cw / 2}" y="${oy - 6}" text-anchor="middle" font-size="12" fill="${COL.kmt}">s${q + 1}</text>`;
        s += `<text x="${ox + rHW + K * cw + cw / 2 + 6}" y="${oy - 6}" text-anchor="middle" font-size="12" font-weight="700" fill="${COL.sec}">Σ</text>`;
        for (let p = 0; p < K; p++) {
            const y = oy + p * cw, isC = p === CEN;
            s += `<text x="${ox + rHW - 6}" y="${y + cw / 2 + 5}" text-anchor="end" font-size="12" fill="${isC ? COL.kap : COL.kmt}" font-weight="${isC ? '700' : '400'}">s${p + 1}</text>`;
            for (let q = 0; q < K; q++) {
                const x = ox + rHW + q * cw;
                const fill = (isC || q === CEN) ? COL.ring : '#fff';
                s += `<rect x="${x}" y="${y}" width="${cw}" height="${cw}" fill="${fill}" stroke="${COL.bd}" stroke-width="0.7"/>`;
                s += `<text x="${x + cw / 2}" y="${y + cw / 2 + 5}" text-anchor="middle" font-size="13" font-family="monospace" fill="${COL.kom}">${DIST[p][q]}</text>`;
            }
            // Summe
            const xs = ox + rHW + K * cw + 6;
            s += `<rect x="${xs}" y="${y}" width="${cw}" height="${cw}" fill="${isC ? COL.hl : '#fff'}" stroke="${isC ? COL.kap : COL.bd}" stroke-width="${isC ? '2' : '0.7'}"/>`;
            s += `<text x="${xs + cw / 2}" y="${y + cw / 2 + 5}" text-anchor="middle" font-size="13" font-family="monospace" font-weight="${isC ? '700' : '400'}" fill="${isC ? COL.kap : COL.kom}">${ROWSUM[p]}</text>`;
        }
        const capY = oy + K * cw + 26;
        s += `<text x="0" y="${capY}" font-size="13" fill="${COL.kom}">Kleinste Gesamtdistanz → Zentrum <tspan fill="${COL.kap}" font-weight="700">s${CEN + 1} = ${S[CEN]}</tspan>.</text>`;
        s += `<text x="0" y="${capY + 26}" font-size="13" fill="${COL.kom}"> Das Alignment startet mit dieser Sequenz.</text>`;

        const w = ox + rHW + K * cw + 6 + cw + 10, h = capY + 10;
        return {w, h: Math.max(h, 120), s};
    }

    function mergeSVG(f) {
        let s = `<text x="0" y="16" font-size="15" font-weight="700" fill="${COL.kap}">Phase 2 – s${f.p + 1} einfügen</text>`;
        // paarweises Alignment
        let y = 40;
        s += `<text x="0" y="${y - 6}" font-size="12" fill="${COL.kmt}">optimales paarweises Alignment A{c,${f.p + 1}}:</text>`;
        const gapC = [...f.aa].map(ch => ch === '-'); // neue Gaps in s_c
        s += `<text x="0" y="${y + 18}" font-size="12" fill="${COL.kmt}">s${CEN + 1}</text>`;
        s += `<g transform="translate(28,${y + 3})">${seqCells(0, 0, f.aa, {cw: 22, hlCols: gapC})}</g>`;
        s += `<text x="0" y="${y + 42}" font-size="12" fill="${COL.kmt}">s${f.p + 1}</text>`;
        s += `<g transform="translate(28,${y + 27})">${seqCells(0, 0, f.ab, {cw: 22})}</g>`;
        // MSA
        const my = y + 70;
        s += `<text x="0" y="${my - 6}" font-size="13" font-weight="600" fill="${COL.sec}">Alignment 𝒜_c bisher:</text>`;
        const cw = 24, ox = 30;
        for (let r = 0; r < f.rows.length; r++) {
            const yr = my + r * cw, isNew = r === f.rows.length - 1;
            s += `<text x="${ox - 6}" y="${yr + cw / 2 + 5}" text-anchor="end" font-size="12" fill="${isNew ? COL.kap : COL.kmt}" font-weight="${isNew ? '700' : '400'}">s${f.labels[r] + 1}</text>`;
            s += `<g transform="translate(${ox},${yr})">${seqCells(0, 0, f.rows[r].join(''), {
                cw,
                hlCols: f.newGap,
                rowFill: isNew ? '#FFF3F8' : '#fff'
            })}</g>`;
        }
        const capY = my + f.rows.length * cw + 24;
        const nNew = f.newGap.filter(Boolean).length;
        s += `<text x="0" y="${capY}" font-size="13" fill="${COL.kom}">${nNew > 0 ? `<tspan fill="${COL.defi}" font-weight="700">${nNew}</tspan> neue Lücke(n) in s${CEN + 1}` : 'keine neue Lücke in s' + (CEN + 1)} – rosa Spalten wurden in allen bisherigen Zeilen ergänzt (once a gap, always a gap).</text>`;
        const w = Math.max(ox + f.rows[0].length * cw, 40 + Math.max(f.aa.length, f.ab.length) * 22) + 20,
            h = capY + 10;
        return {w, h, s};
    }

    function buildSVG() {
        const f = FRAMES[frame];
        const g = f.type === 'dist' ? distSVG() : mergeSVG(f);
        const W = Math.max(g.w + 20, 360) + 200, H = g.h + 56;
        return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="max-width:100%;height:auto" font-family="sans-serif"><rect width="${W}" height="${H}" fill="#fff"/><g transform="translate(10,10)">${g.s}</g></svg>`;
    }

    function status() {
        const st = document.getElementById('status');
        if (FRAMES[frame].type === 'dist') st.innerHTML = `Zentrum: <b>s${CEN + 1} = ${S[CEN]}</b> (Gesamtdistanz ${ROWSUM[CEN]}). Schritt ${frame + 1}/${FRAMES.length}.`;
        else st.innerHTML = `Füge <b>s${FRAMES[frame].p + 1}</b> ein. Schritt ${frame + 1}/${FRAMES.length}.`;
    }

    function render() {
        window.curSVG = buildSVG();
        document.getElementById('stage').innerHTML = window.curSVG;
        status();
    }

    function stop() {
        if (timer) {
            clearInterval(timer);
            timer = null;
        }
        document.getElementById('play').textContent = '▶ Abspielen';
    }

    function play() {
        if (timer) {
            stop();
            return;
        }
        document.getElementById('play').textContent = '⏸ Pause';
        timer = setInterval(() => {
            if (frame >= FRAMES.length - 1) {
                stop();
            } else {
                frame++;
                render();
            }
        }, 1200);
    }

    function download(name, svg) {
        const blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + svg], {type: 'image/svg+xml;charset=utf-8'});
        const u = URL.createObjectURL(blob), a = document.createElement('a');
        a.href = u;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(u), 1500);
    }

    document.getElementById('load').onclick = () => {
        stop();
        build();
        render();
    };
    document.getElementById('prev').onclick = () => {
        if (frame > 0) {
            frame--;
            render();
        }
    };
    document.getElementById('next').onclick = () => {
        if (frame < FRAMES.length - 1) {
            frame++;
            render();
        }
    };
    document.getElementById('play').onclick = play;
    document.getElementById('dl').onclick = () => download('center_star.svg', window.curSVG || buildSVG());
    build();
    render();
</script>
</body>
</html>
